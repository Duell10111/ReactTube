name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: npm run lint --quiet

      - name: Typecheck files
        run: npm run typecheck

      - name: Run tests
        run: npm test
