name: Build
on:
  workflow_dispatch:
    inputs:
      build-ios-phone:
        description: Build the experimental unsigned iOS variant without Siri
        type: boolean
        default: false
      build-ios-siri:
        description: Also build unsigned iOS with Siri (requires paid-team signing before installation)
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_ios_without_signing_tvos:
    name: Build tvOS without Siri (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Archive tvOS
        uses: ./.github/actions/apple-archive
        with:
          is-tv: "true"
          siri-enabled: "false"
          artifact-name: reacttube-tvos-no-siri

  # Phone archives remain opt-in until the existing native build failures have
  # been verified on the hosted runner. Disabling Siri does not fix those errors.
  build_ios_without_signing_phone:
    name: Build iOS without Siri (unsigned, experimental)
    if: github.event_name == 'workflow_dispatch' && inputs.build-ios-phone
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Archive iOS without Siri
        uses: ./.github/actions/apple-archive
        with:
          is-tv: "false"
          siri-enabled: "false"
          artifact-name: reacttube-ios-no-siri

  build_ios_without_signing_siri:
    name: Build iOS with Siri (unsigned, experimental)
    if: github.event_name == 'workflow_dispatch' && inputs.build-ios-siri
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Archive iOS with Siri
        uses: ./.github/actions/apple-archive
        with:
          is-tv: "false"
          siri-enabled: "true"
          artifact-name: reacttube-ios-siri

  build_apk_without_signing_phone:
    name: Build Expo Android Phone
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup
        uses: ./.github/actions/prebuild
        with:
          is-tv: "false"
          platform: android
      - name: Build Expo Android
        run: |
          cd android
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: android_phone_apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
