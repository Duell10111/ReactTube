appId: com.duell10111.reacttube
name: Launches to the home tab
tags:
  - smoke
---
- launchApp:
    clearState: true
# iOS exposes tab buttons as "Home, tab, 1 of 5"; Android uses the plain title.
# The splash screen also reads "ReactTube", so wait for the tab bar. The CI
# emulator renders in software and can take well over a minute to get there.
- extendedWaitUntil:
    visible: "Home(, tab.*)?"
    timeout: 120000
- assertVisible: "ReactTube"
- assertVisible: "Search"
- assertVisible: "You(, tab.*)?"
