appId: com.duell10111.reacttube
name: Opens every tab and the settings
tags:
  - smoke
---
- launchApp:
    clearState: true
# The splash screen also reads "ReactTube", so wait for the tab bar. The CI
# emulator renders in software and can take well over a minute to get there.
- extendedWaitUntil:
    visible: "Home(, tab.*)?"
    timeout: 120000
- tapOn: "Subscriptions(, tab.*)?"
- tapOn: "Music(, tab.*)?"
- tapOn: "Downloads(, tab.*)?"
- tapOn: "You(, tab.*)?"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Settings"
- extendedWaitUntil:
    visible: "Playback diagnostics"
    timeout: 15000
