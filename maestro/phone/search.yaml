appId: com.duell10111.reacttube
name: Searches for a video
tags:
  - smoke
---
- launchApp:
    clearState: true
# The splash screen also reads "ReactTube", so wait for the tab bar. The CI
# emulator renders in software and can take well over a minute to get there.
- extendedWaitUntil:
    visible: "Home(, tab.*)?"
    timeout: 120000
- runFlow:
    file: subflows/search.yaml
    env:
      QUERY: "big buck bunny"
- assertVisible: "(?i).*big buck bunny.*, .*ago.*"
